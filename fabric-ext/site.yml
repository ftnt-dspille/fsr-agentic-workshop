---
# GitHub extension phase for the lab's onboarding controller (RedTeam_LXC).
# The controller clones this repo at main on every boot and runs this playbook once per
# gate, after its built-in onboarding, against its own inventory (FGT_IP and the device
# logins come from its environment). Push new steps here; no device config rebuild needed.
# Keep steps idempotent: they run on every boot, for every gate.

- name: Record that the GitHub extension phase ran
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Write the proof file
      ansible.builtin.copy:
        dest: /fabric/logs/ext-proof.json
        mode: "0644"
        content: |
          {
            "source": "github.com/ftnt-dspille/fsr-agentic-workshop",
            "path": "fabric-ext/site.yml",
            "gate": "{{ lookup('env', 'FGT_IP') }}",
            "ran_at": "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ') }}"
          }

- name: Read-only check that this gate answers the controller's API login
  hosts: fortigates
  gather_facts: false
  tasks:
    - name: Read the gate's system status
      fortinet.fortios.fortios_monitor_fact:
        selector: system_status
        vdom: root
      register: status

    - name: Report it
      ansible.builtin.debug:
        msg: "ext-check: gate {{ status.meta.results.hostname | default('?') }} answers, FortiOS {{ status.meta.version | default('?') }}"
